<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
<title id="title">CHENGXU local tool architecture — v0.9.7</title>
<desc id="desc">UI and batch requests share the generation service: identity and input validation, preflight, program reference drafts, actual local inference, parsing, conditional source frames, client-copy framing, output checks, contract response and persistence. Saved artifacts feed offline verification, separate AI and human review, CSV export and a private review package. Rejected output has bounded repair with no provider-failure fallback.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53647a"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172a43}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#53647a}.label{font-size:16px;font-weight:700}.body{font-size:14px}.lane{font-size:13px;font-weight:700;letter-spacing:1px;fill:#53647a}.edge{fill:none;stroke:#53647a;stroke-width:2;marker-end:url(#arrow)}.failure{fill:none;stroke:#b7791f;stroke-width:1.7;stroke-dasharray:6 5;marker-end:url(#arrow)}</style>
