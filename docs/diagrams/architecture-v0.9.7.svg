<text x="54" y="626" class="label">Persist result</text>
<text x="54" y="649" class="body">SQLite identity and artifacts</text>
<text x="54" y="667" class="body">Raw attempts + final response</text>
<rect x="350" y="600" width="260" height="92" rx="9" fill="#e8f5ed" stroke="#c4d2e2"/>
<text x="364" y="626" class="label">Saved batch evidence</text>
<text x="364" y="649" class="body">Manifest / per-case JSON</text>
<text x="364" y="667" class="body">References and transformations</text>
<rect x="660" y="600" width="260" height="92" rx="9" fill="#e8f5ed" stroke="#c4d2e2"/>
<text x="674" y="626" class="label">Offline operations</text>
<text x="674" y="649" class="body">Verify source-to-export chain</text>
<text x="674" y="667" class="body">Export exact eight-column CSV</text>
<rect x="970" y="600" width="260" height="92" rx="9" fill="#e8f5ed" stroke="#c4d2e2"/>
<text x="984" y="626" class="label">Separate review records</text>
<text x="984" y="649" class="body">AI source scores / comments</text>
<text x="984" y="667" class="body">Human-rating template: pending</text>
<rect x="1280" y="600" width="260" height="92" rx="9" fill="#e8f5ed" stroke="#c4d2e2"/>
<text x="1294" y="626" class="label">Private review package</text>
<text x="1294" y="649" class="body">B / C / D / E, source, evidence</text>
<text x="1294" y="667" class="body">No publishing or sending</text>
<path d="M170 392V600" class="edge"/>
<path d="M300 646H350" class="edge"/>
<path d="M610 646H660" class="edge"/>
<path d="M920 646H970" class="edge"/>
<path d="M1230 646H1280" class="edge"/>
<text x="40" y="760" class="label">Authorship boundary</text>
<text x="40" y="785" class="body">Program references + actual model editing + trusted composition. Preserve the original provider response and every final transformation.</text>
<text x="40" y="810" class="body">The offline lane groups evidence operations, not a mandatory scoring-before-export order. AI self-review is not genuine human acceptance.</text>
<text x="40" y="835" class="sub">Optional remote adapter is not shown or validated by the local result. No CRM, live inventory, production hosting or automatic outreach is implemented.</text>
</svg>
