<rect x="1280" y="300" width="260" height="92" rx="9" fill="#fff" stroke="#c4d2e2"/>
<text x="1294" y="326" class="label">Parse provider JSON</text>
<text x="1294" y="349" class="body">Structure and internal labels</text>
<text x="1294" y="367" class="body">Original response retained</text>
<rect x="970" y="300" width="260" height="92" rx="9" fill="#fff" stroke="#c4d2e2"/>
<text x="984" y="326" class="label">Conditional source frames</text>
<text x="984" y="349" class="body">Greeting / product / event</text>
<text x="984" y="367" class="body">Other scenarios pass through</text>
<rect x="660" y="300" width="260" height="92" rx="9" fill="#fff" stroke="#c4d2e2"/>
<text x="674" y="326" class="label">Client-copy framing</text>
<text x="674" y="349" class="body">Known address / required policy</text>
<text x="674" y="367" class="body">Audited narrow normalization</text>
<rect x="350" y="300" width="260" height="92" rx="9" fill="#fff" stroke="#c4d2e2"/>
<text x="364" y="326" class="label">Final output checks</text>
<text x="364" y="349" class="body">Source, policy, scope, diversity</text>
<text x="364" y="367" class="body">Checks are not semantic proof</text>
<rect x="40" y="300" width="260" height="92" rx="9" fill="#e9f1ff" stroke="#c4d2e2"/>
<text x="54" y="326" class="label">Contract response</text>
<text x="54" y="349" class="body">3 candidates or explicit failure</text>
<text x="54" y="367" class="body">No automatic sending</text>
<path d="M1410 222V300" class="edge"/>
<path d="M350 346H300" class="edge"/>
<path d="M660 346H610" class="edge"/>
<path d="M970 346H920" class="edge"/>
<path d="M1280 346H1230" class="edge"/>
<path d="M790 222V260H170V300" class="edge"/>
<text x="360" y="251" class="sub">Invalid / blocked / clarification outcomes bypass inference</text>
<rect x="350" y="438" width="1190" height="59" rx="8" fill="#fff7e8" stroke="#e5c58e"/>
<text x="370" y="462" class="label">Rejected output → bounded repair if budget remains; otherwise explicit non-success</text>
<text x="370" y="483" class="body">No provider switch or reference/preview fallback. All attempts remain available; never silently substitute an older candidate.</text>
<path d="M1410 392V438" class="failure"/>
<path d="M480 392V438" class="failure"/>
