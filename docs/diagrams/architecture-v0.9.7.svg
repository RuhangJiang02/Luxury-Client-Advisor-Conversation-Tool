<text x="40" y="578" class="lane">PERSISTED EVIDENCE AND OFFLINE OPERATIONS</text>

<rect x="40" y="130" width="260" height="92" rx="9" fill="#e9f1ff" stroke="#c4d2e2"/>
<text x="54" y="156" class="label">Advisor UI / batch CLI</text>
<text x="54" y="179" class="body">Explicit submitted request</text>
<text x="54" y="197" class="body">Preview is separate</text>
<rect x="350" y="130" width="260" height="92" rx="9" fill="#fff" stroke="#c4d2e2"/>
<text x="364" y="156" class="label">Reserve and validate</text>
<text x="364" y="179" class="body">SQLite request identity</text>
<text x="364" y="197" class="body">Schema, references and dates</text>
<rect x="660" y="130" width="260" height="92" rx="9" fill="#fff" stroke="#c4d2e2"/>
<text x="674" y="156" class="label">Business preflight</text>
<text x="674" y="179" class="body">Contact and essential facts</text>
<text x="674" y="197" class="body">Product / care eligibility</text>
<rect x="970" y="130" width="260" height="92" rx="9" fill="#fff" stroke="#c4d2e2"/>
<text x="984" y="156" class="label">Reference construction</text>
<text x="984" y="179" class="body">Three program-authored drafts</text>
<text x="984" y="197" class="body">Derived from supplied fields</text>
<rect x="1280" y="130" width="260" height="92" rx="9" fill="#e9f1ff" stroke="#c4d2e2"/>
<text x="1294" y="156" class="label">Actual local inference</text>
<text x="1294" y="179" class="body">Ollama / qwen3:4b</text>
<text x="1294" y="197" class="body">Recorded temperature: 0</text>
